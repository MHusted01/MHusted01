<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Marcus, developer and IT security student in Aarhus">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1e3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f95ff"/>
      <stop offset="1" stop-color="#7cc4ff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2f95ff" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="700" y="0" width="500" height="300" fill="url(#dots)"/>

  <!-- shield outline -->
  <g transform="translate(1000 150)" fill="none" stroke="#4aa8ff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0.9">
    <path d="M0,-92 L74,-64 V6 C74,52 42,80 0,96 C-42,80 -74,52 -74,6 V-64 Z"/>
    <path d="M-30,6 L-8,28 L34,-16"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <text x="72" y="92" fill="#7cc4ff">~ $ <tspan fill="#e6edf7">whoami</tspan></text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="70" y="168" font-size="72" font-weight="700" fill="#ffffff">Marcus</text>
    <rect x="72" y="190" width="96" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="236" font-size="26" fill="#c9d6ea">Developer · Datamatiker · PBA IT Security student</text>
    <text x="72" y="270" font-size="20" fill="#7f93b3">Aarhus, Denmark</text>
  </g>
</svg>
